# workingset.toml — the configuration on screen in the interactive explorer.
# Qwen3.6-35B-A3B · 2×H200 data-par · max_num_batched_tokens 32768 · generated 2026-09-06
# reproduce this page: https://workingset.tomvaucourt.com/#model=35BA3B&ngpu=2&ram=512&users=200
# DP2: every figure is PER REPLICA GROUP — point base_url at ONE group.
# No predictions live here: `ws predict workingset.toml` computes them.

schema_version = 1

[deployment]
model = "35BA3B"
gpu = "H200"
tensor_parallel = 1
replicas = 2
weight_dtype = "fp8"
kv_dtype = "fp8"
max_num_batched_tokens = 32768
max_model_len = 180000
ram_gib = 256

[workload]
system_prefix_tokens = 15000
user_prompt_median_tokens = 31000
user_prompt_sigma = 0.81
warm_turn_tokens = 2000
think_time_s = 30
subagent_ratio = 0.1
subagent_median_tokens = 8000
subagent_sigma = 0.9
subagent_prefix_tokens = 3000
sub_shares_prefix = false
miss_rate = 0.01
max_output_tokens = 400
users = 100

[slo]
ttft_budget_s = 10
itl_floor_tok_s = 40
percentile = 95

[endpoint]
base_url = "http://localhost:8000/v1"
model = "<your served model id — a Qwen3.6-35B-A3B FP8 checkpoint>"
api_key_env = "VLLM_API_KEY"

[calibration]
mfu = 0.45
mbu = 0.22
