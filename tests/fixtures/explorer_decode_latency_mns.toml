# workingset.toml — the configuration on screen in the interactive explorer.
# reproduce this page: https://workingset.tomvaucourt.com/#model=35BA3B&ngpu=2&tp=2&dprice=latency&dspec=2&dfixed=2.2&mns=48

schema_version = 1

[deployment]
model = "35BA3B"
gpu = "H200"
tensor_parallel = 2
replicas = 1
weight_dtype = "fp8"
kv_dtype = "fp8"
max_num_batched_tokens = 32768
max_model_len = 180000
ram_gib = 0
recurrent_state_dtype = "bf16"
kv_sharding = "dcp"
weight_overhead = 0
max_num_seqs = 48

[workload]
system_prefix_tokens = 15000
user_prompt_median_tokens = 31000
user_prompt_sigma = 0.81
warm_turn_tokens = 2000
think_time_s = 30
subagent_ratio = 0.1
subagent_median_tokens = 8000
subagent_sigma = 0.9
subagent_prefix_tokens = 3000
sub_shares_prefix = false
miss_rate = 0.01
max_output_tokens = 400
users = 64

[slo]
ttft_budget_s = 10
itl_floor_tok_s = 40
percentile = 95

[endpoint]
base_url = "http://localhost:8000/v1"
model = "<your served model id — a Qwen3.6-35B-A3B FP8 checkpoint>"
api_key_env = "VLLM_API_KEY"

[calibration]
mfu = 0.45
mbu = 0.22
mtp = 1.7
decode_pricing = "latency"
decode_bw_eff = 0.36
decode_fixed_ms = 2.2
spec_tokens = 2
