# Nightly sweep for orphaned preview workers — the backstop behind the per-PR
# cleanup in preview-explorer.yml. Catches everything that job can't:
#   - workingset-explorer-pr<N> whose PR is closed but whose close event was
#     filtered out (final diff no longer touched interactive/), or whose
#     cleanup run failed
#   - manually-dispatched workingset-explorer-<slug> previews, deleted after
#     slug_ttl_days without a deploy (default 7)
# Production (workingset-explorer, no dash suffix) never matches the
# "workingset-explorer-" prefix filter and is never touched. The pr<N> name
# space is reserved for PR previews — don't dispatch-deploy a slug shaped
# like pr<number>, the sweep will judge it by PR #<number>'s state.
#
# Previews live on ws-<slug>.preview.tomvaucourt.com behind Cloudflare Access
# (workers_dev is false — see preview-explorer.yml). That changes nothing about
# how the sweep *finds* orphans: it lists account Worker scripts by name, which
# is independent of routing, and it never had a workers.dev URL in its
# judgement logic. It does change cleanup — each preview now also owns a custom
# domain, detached explicitly below before its script is deleted.
#
#
# A second job, access-gate, runs after the sweep and checks that the surviving
# previews still answer with Cloudflare Access rather than with the explorer —
# see its comment for why that alarm lives here.
#
# Manual run (once on main): gh workflow run preview-sweep.yml
#   -f dry_run=true to only list what would be deleted (and detached)
#   -f slug_ttl_days=0 to expire slug previews immediately
name: Sweep orphaned preview workers

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false
      slug_ttl_days:
        description: "Delete dispatch-named previews not deployed for this many days"
        default: "7"

concurrency:
  group: preview-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # no checkout: pure REST against Cloudflare + the GitHub API.
      # Fails closed: if listing workers or open PRs fails, bash -e aborts
      # before anything is deleted. Deploy races are handled per worker: the
      # PR's state is re-resolved immediately before each DELETE, so a PR
      # reopened mid-sweep keeps its fresh preview.
      - name: Sweep
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TTL_DAYS: ${{ inputs.slug_ttl_days || '7' }}
        run: |
          [[ "$TTL_DAYS" =~ ^[0-9]+$ ]] || { echo "::error::slug_ttl_days must be a non-negative integer"; exit 1; }
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          api="$root/scripts"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT

          # Detach a preview's custom domain before its script is deleted.
          # Cloudflare documents neither that deleting a script removes its
          # Custom Domains nor that it leaves them behind, and wrangler has no
          # custom-domain command, so this is explicit rather than trusting an
          # undocumented cascade. Detaching takes the Cloudflare-managed DNS
          # record with it; the auto-generated Advanced Certificate is
          # documented as *not* deleted, which is inert (an unused cert in the
          # zone's inventory) and is the only residue.
          #
          # The jq filter re-checks service and hostname client-side: if the
          # ?service= query filter were ever ignored, an unfiltered list plus a
          # blind delete loop would take down workingset.tomvaucourt.com.
          # Honours DRY_RUN itself rather than being skipped by the dry-run
          # branch: a dry run that listed only the scripts it would delete
          # would under-report the blast radius, since a real run also drops
          # DNS records and leaves certificates behind.
          detach_domains() {
            # list and filter in two assignments rather than one pipeline, so
            # the failure mode does not depend on pipefail being set — the
            # default runner shell here is `bash -e {0}`, no pipefail, and a
            # failed curl piped into a happy jq would read as "no domains
            # attached", i.e. a silent skip of the detach.
            local worker="$1" list hosts ids id code
            list=$(curl -sS --fail "${auth[@]}" "$root/domains?service=$worker") || {
              echo "::error::listing Worker domains for $worker failed"; return 1; }
            local filter='.result[]?
                  | select(.service == $s)
                  | select(.hostname | endswith(".preview.tomvaucourt.com"))'
            if [ "$DRY_RUN" = "true" ]; then
              hosts=$(jq -r --arg s "$worker" "$filter"' | "\(.id) (\(.hostname))"' <<<"$list")
              [ -n "$hosts" ] || { echo "        no custom domain attached"; return 0; }
              while read -r h; do echo "        would detach custom domain $h"; done <<<"$hosts"
              return 0
            fi
            ids=$(jq -r --arg s "$worker" "$filter"' | .id' <<<"$list")
            for id in $ids; do
              code=$(curl -sS -o "$tmp" -w '%{http_code}' -X DELETE "${auth[@]}" "$root/domains/$id")
              case "$code" in
                200|204|404) echo "        detached custom domain $id from $worker" ;;
                *) echo "::error::detaching $id from $worker failed with HTTP $code"; cat "$tmp"; return 1 ;;
              esac
            done
          }

          workers='[]'
          page=1
          while :; do
            chunk=$(curl -sS --fail "${auth[@]}" "$api?per_page=100&page=$page")
            workers=$(jq -c '.[0] + .[1].result' <<<"[$workers,$chunk]")
            pages=$(jq -r '.result_info.total_pages
              // (if .result_info.total_count then ((.result_info.total_count / 100) | ceil) else empty end)' <<<"$chunk")
            if [ -z "$pages" ]; then
              # Cloudflare's workers/scripts list ignores per_page/page and
              # returns every script in one response with no pagination
              # metadata (observed live 2026-08-04): this is the normal path,
              # not a truncation — so a plain log line, not a ::warning
              # annotation on every nightly run.
              echo "result_info has no pagination metadata; endpoint returns all scripts in one page"
              pages=1
            fi
            [ "$page" -ge "$pages" ] && break
            page=$((page + 1))
          done

          open_prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --paginate --jq '.[].number')

          now=$(date +%s)
          deleted=0 kept=0 would_delete=0 skipped=0
          while IFS=$'\t' read -r name modified; do
            suffix="${name#workingset-explorer-}"
            reason="" recheck_pr=""
            if [[ "$suffix" =~ ^pr[0-9]+$ ]]; then
              n="${suffix#pr}"
              grep -qx "$n" <<<"$open_prs" || { reason="PR #$n is not open"; recheck_pr="$n"; }
            else
              [ -n "$modified" ] || { echo "::error::no timestamp on $name; refusing to age it"; exit 1; }
              age_days=$(( (now - $(date -d "$modified" +%s)) / 86400 ))
              [ "$age_days" -ge "$TTL_DAYS" ] && reason="slug preview idle ${age_days}d (TTL ${TTL_DAYS}d)"
            fi
            if [ -z "$reason" ]; then
              echo "keep    $name"
              kept=$((kept+1))
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN would delete $name — $reason"
              detach_domains "$name"
              would_delete=$((would_delete+1))
              continue
            fi
            # re-resolve PR state right before deleting: the open_prs snapshot
            # is stale by now, and a PR reopened mid-sweep has a live preview.
            # A 404 (PR never existed) is deletable garbage; any other GH
            # failure skips the worker rather than deleting on uncertainty.
            if [ -n "$recheck_pr" ]; then
              # stderr goes to a file, never into $state — a stray gh warning
              # on a successful call must not corrupt the "open" comparison
              if state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$recheck_pr" --jq .state 2>"$tmp"); then
                :
              elif grep -q "HTTP 404" "$tmp"; then
                state=missing
              else
                echo "::warning::could not resolve PR #$recheck_pr; skipping $name"
                skipped=$((skipped+1))
                continue
              fi
              if [ "$state" = "open" ]; then
                echo "keep    $name — PR #$recheck_pr reopened mid-sweep"
                kept=$((kept+1))
                continue
              fi
            fi
            detach_domains "$name"
            code=$(curl -sS -o "$tmp" -w '%{http_code}' -X DELETE "${auth[@]}" "$api/$name?force=true")
            case "$code" in
              200|204|404) echo "deleted $name — $reason"; deleted=$((deleted+1)) ;;
              *) echo "::error::deleting $name failed with HTTP $code"; cat "$tmp"; exit 1 ;;
            esac
          done < <(jq -r '.[]
            | select(.id | startswith("workingset-explorer-"))
            | [.id, (.modified_on // .created_on)] | @tsv' <<<"$workers")

          echo "Sweep done: deleted=$deleted kept=$kept would_delete=$would_delete skipped=$skipped dry_run=$DRY_RUN"

  # Preview privacy now lives outside this repo: the Cloudflare Access app for
  # *.preview.tomvaucourt.com is bootstrapped in the website repo, so nothing
  # here would notice if it were deleted, narrowed, or left un-bootstrapped —
  # every preview would just quietly become a public URL. The PREVIEW_PASSWORD
  # it replaced was at least self-contained. This job is the missing alarm:
  # ask each surviving preview hostname, as an unauthenticated client, whether
  # Access answers instead of the explorer.
  #
  # The judgement is deliberately lopsided. HTTP 200 is proof the gate is not
  # there, and fails the job (a failed scheduled run mails Tom). Everything
  # else — a redirect to cloudflareaccess.com, a 401/403, a connection error, a
  # certificate still provisioning on a preview deployed minutes ago — is
  # either fine or merely unproven, so it warns at most. This job never deletes
  # anything; the sweep above owns that.
  #
  # Runs after the sweep (and even if the sweep failed) so it checks the set of
  # previews that actually survived the night.
  access-gate:
    needs: sweep
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check previews answer with Access, not with content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          list=$(curl -sS --fail -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$root/domains") || {
            echo "::warning::could not list Worker domains; skipping the Access gate check"
            exit 0; }
          hosts=$(jq -r '.result[]?
            | select(.service | startswith("workingset-explorer-"))
            | select(.hostname | endswith(".preview.tomvaucourt.com"))
            | .hostname' <<<"$list")
          if [ -z "$hosts" ]; then
            echo "No preview hostnames live; nothing to check."
            exit 0
          fi
          open=0
          while read -r h; do
            # no -L: the redirect itself is the evidence. Accept: text/html
            # because the case that matters is a human opening the link.
            out=$(curl -sS -m 15 -o /dev/null -H 'Accept: text/html' \
              -w '%{http_code} %{redirect_url}' "https://$h/" || true)
            code=${out%% *}; loc=${out#* }
            case "$code" in
              200)
                echo "::error::$h served the explorer to an unauthenticated request — the Cloudflare Access app for *.preview.tomvaucourt.com is missing or no longer covers it"
                open=$((open+1)) ;;
              301|302|303|307|308)
                case "$loc" in
                  *cloudflareaccess.com*) echo "ok      $h — redirected to Access" ;;
                  *) echo "::warning::$h redirected to ${loc:-<none>}, which is not an Access login; check it by hand" ;;
                esac ;;
              401|403) echo "ok      $h — HTTP $code without credentials" ;;
              000) echo "::warning::$h unreachable (TLS on a freshly created preview takes a few minutes); proves nothing either way" ;;
              *) echo "::warning::$h answered HTTP $code; unexpected, check it by hand" ;;
            esac
          done <<<"$hosts"
          if [ "$open" -gt 0 ]; then
            echo "::error::$open preview hostname(s) are publicly readable — fix the Access app before the next preview deploy"
            exit 1
          fi
          echo "Access gate check done: no preview served content unauthenticated."
