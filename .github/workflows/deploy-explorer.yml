# Deploys interactive/index.html to the workingset-explorer Worker
# (workingset.tomvaucourt.com) on every push to main that touches it.
# Needs two repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy explorer

on:
  push:
    branches: [main]
    paths:
      - interactive/**
      - wrangler.jsonc
      - .github/workflows/deploy-explorer.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
