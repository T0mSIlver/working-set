[project]
name = "workingset"
version = "0.1.0"
description = "How many agentic-coding users a local LLM deployment serves: capacity model, CLI and live-endpoint hypothesis tests"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tom Vaucourt" }]
keywords = ["vllm", "llm", "serving", "capacity-planning", "kv-cache", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# the study scripts under scripts/ (figures, tables, traces)
study = ["pandas>=2.0", "scipy>=1.13", "matplotlib>=3.9"]

[project.scripts]
ws = "workingset.cli:main"

[project.urls]
Homepage = "https://workingset.tomvaucourt.com"
Repository = "https://github.com/T0mSIlver/working-set"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workingset"]

[tool.hatch.build.targets.sdist]
include = ["src/workingset", "README.md"]

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.0", "scipy>=1.13", "matplotlib>=3.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: calibration self-checks (~seconds)"]
