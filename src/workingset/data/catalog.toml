w_decode_shared = 125.0e9        # 88 FP8 layers + BF16 lm_head; vision tower not read
w_route_pertok = 0.0
w_route_total = 0.0
layers = 88
rec_layers = 0
draft_layers = 0
# no draft model ships with it (the external EAGLE-v1 draft is unsized)
