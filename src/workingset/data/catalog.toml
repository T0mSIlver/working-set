# checkpoint. research/model_mistral_large4.md.
[models.ML4]
name = "Mistral-Large-4 (MoE 1.05T-A49B, MLA+DSA, KV sharing)"
kv_bpt = 47_136                  # 63 x 656 (fp8_ds_mla latent) + 44 x 132 (indexer keys)
deltanet_state = 4_030_464       # DSpark drafter: 3 MLA layers x 2,048-token window x 656 B
                                 # (storage incl. the drafter, as DSV4F's DSpark windows)
state_step_bytes = 0.0           # the drafter's window reads are folded into mtp, as every
                                 # draft model's are; the target layers carry no state
state_fp32_ok = false            # an fp8 latent window, not a bf16 recurrent state
w_resident = 1_060_548_427_328   # FP8 ckpt metadata.total_size, shard-header-verified
                                 # (incl. the 4.20 GB BF16 DSpark drafter and 3.41 GB vision)
w_decode_shared = 20_990_666_304 # exact ledger: MLA 8.67 + shared exp 8.04 + lm_head 2.52
                                 # + indexers 1.20 + dense MLP 0.45 + routers 0.11 + norms
w_route_pertok = 32_169_775_104  # 4 experts x 113,273,856 B (FP8 + F32 block scales) x 71
w_route_total = 1_029_432_803_328 # 128 experts (kink at n = 128/4 = 32)
layers = 72
rec_layers = 0
draft_layers = 3
# draft pass: the 3-layer dense DSpark drafter 4,199,938,048 B BF16
# (MEASURED) + lm_head 2.517e9 BF16 (research/model_mistral_large4.md:113)
w_draft = 6.717e9
w_draft_route_pertok = 0.0
# acceptance MEASURED (outside): the vLLM recipe's DSpark accepted lengths
# 2.98 / 2.85 / 2.79 at 8k / 32k / 60k input, 3 drafts, on GB300 -> geometric
# a = 0.777 at 32k (research/model_mistral_large4.md #5)
acceptance = 0.777
acceptance_measured = true
spec_tokens = 3                  # num_speculative_tokens: DSpark, fixed by the checkpoint (vLLM recipe)
draft_method = "dspark"
# mistralai/Mistral-Large-4-1T-A52B-NVFP4 (2026-10-29), MEASURED from
# every shard header: only the 71 MoE layers' routed experts change,
# to ModelOpt NVFP4 (63,701,016 B/expert, x0.5624); attention,
# indexers, shared experts and dense MLP stay FP8, the drafter, vision
# and heads BF16, byte-identical. research/model_mistral_large4.md #4.
nvfp4_w = [
    610_030_457_408,
    20_990_666_304,
    18_091_088_544,  # 4 x 63,701,016 x 71
    578_914_833_408,  # 128 x 63,701,016 x 71 (kink n=32)
]
kv_decode_bpt = 5_808            # 44 indexer layers x 132 B per CONTEXT token
kv_decode_const = 96_731_136     # 72 layers x top-2048 x 656 B per active seq (the 9
                                 # KV-sharing layers read layer 35's latents)
kv_decode_topk = 2_048           # index_topk, read in token space
kv_fp16_ok = false               # every NVIDIA config Mistral and vLLM document runs the fp8
                                 # (fp8_ds_mla) latent cache, "needed" per the NVFP4 card;
                                 # the bfloat16 opt-out is the ROCm recipe's only
max_ctx = 1_048_576              # native 1M (YaRN x2048 over 512); the recipe validates 262,144
# prefill: MoE active GEMM params excl embed/lm_head (49.82e9 ledger;
# card "49B active", 52B with embeddings + lm_head = 52.34e9 ✓).
# attn_layers/attn_d price MLA as DENSE attention over all 72 layers,
# as GLM-5.3: an upper bound (DSA prefill sparsity not characterised).
# 64 heads x 128 (qk_nope 64 + rope 64 = v_head_dim 128).
params_prefill = 49.82e9
attn_layers = 72
attn_d = 8192                    # = 64 * 128
kv_heads = 1
state_heads = 1                  # MLA latents AND the drafter's latent windows replicate
                                 # under plain TP

[models.ML4.quality]  # high effort, read 2026-11-04; no 2.1 run
tb40 = [49, 198]
aa = "mistral-large-4"

[models.ML4.explorer]
short = "Mistral-Large-4"
tip = "Mistral-Large-4 — 1.05T-A49B MoE (52B active with embeddings and lm_head), 72 layers of MLA + DSA as GLM-5.3, plus two cache savings: 9 late NoPE layers attend to layer 35's latents and store none, and 28 layers reuse the top-k of the indexer before them. 46.0 KiB/token stored in vLLM's 656-B fp8_ds_mla rows, 3% below GLM-5.3 on B300, plus 3.8 MiB/session for the DSpark drafter's windows; decode reads top-2048 latents on all 72 layers and 44 indexer scans. 128 experts / 4 routed (kink n = 32), 32.2 GB of routed experts per token, the study's heaviest. The largest model here: 1,060.5 GB in FP8, so no 8×H200 node holds it (the vLLM recipe runs it on 2×8 H200, which this page does not price); 8×B300 in FP8, from 4×B300 with the official NVFP4 checkpoint (610.0 GB). Terminal-Bench 24.7% on 4.0 (AA, high effort); AA has no 2.1 run. 1M native context, 262k validated by the recipe. License: Mistral Ecosystem Open-Weight (MIT, plus a separate commercial licence for Model-as-a-Service operators)."
kv_tip = "Mistral-Large-4: every NVIDIA configuration Mistral and vLLM document runs the FP8 latent cache (fp8_ds_mla, which the NVFP4 card calls needed); the bfloat16 opt-out exists on ROCm only, so the FP16 toggle is disabled. Its rows are 656 B per latent on both parts: 512 fp8 values, 16 B of scales and 64 rope values kept BF16."
state_tip = "Mistral-Large-4 keeps no recurrent state (MLA attention); the {state_mib} MiB/session it pays is its DSpark drafter's three 2,048-token latent windows, fp8 like the cache — no bf16/fp32 knob to turn, so the control is disabled."
speculative_config = '{"method":"dspark","num_speculative_tokens":3}'
spec_with_dcp = true                # the recipe validates TP8 DCP8 with DSpark (vllm#63796)
kv_cache_dtype = { fp8 = "fp8_ds_mla" }

# Mistral-Large-4's vLLM recipe: the checkpoint loads in Mistral's format
[[models.ML4.explorer.recipe]]
at = 1
flags = ["--tokenizer-mode mistral --config-format mistral --load-format mistral"]

[[models.ML4.explorer.recipe]]
note = "Mistral-Large-4 ships in the vllm/vllm-openai:mistral-large-4 image only (no vLLM release includes it yet, 2026-11-04); the recipe validates --max-model-len 262144"


# MoE 2.8T-A104B (103.2B active excluding embeddings and lm_head), open
# weights 2026-11-04 under the Kimi K3.1 Pro License (MIT terms plus a
# separate agreement for Model-as-a-Service operators above $20M a year and
# a display rule above 100M users; internal use is exempt). Kimi K3's
# layout (69 KDA linear-attention layers, latent MoE, 896 experts / 16
# routed: kink n = 56) with its 24 gated MLA layers replaced by gated DSA
# (MLA latents plus a top-2048 indexer on every one, at 1-indexed layers
# 4, 8, ..., 92 and 93), and block Attention Residuals (12 layers a block).
# The checkpoint ships MXFP4 routed experts (quantization-aware trained)
# and keeps everything else BF16, so the always-active read is the study's
# heaviest: 111.5 GB per step, 61.3 GB of it the KDA projections.
# 1,566.6 GB resident with the DSpark drafter: no 8xH200 node, 8xB300 only.
# research/model_kimi_k31pro.md.
[models.K31P]
name = "Kimi-K3.1-Pro (MoE 2.8T-A104B, KDA+DSA)"
kv_bpt = 19_872                  # 24 x 576 (fp8_e4m3 latent) + 24 x 132 (indexer keys)
                                 # + 5 x 576 (the dense DSpark drafter's latents, which share
                                 # vLLM's block row: dense_mla_draft_bytes_per_token)
deltanet_state = 237_404_160     # 69 KDA layers x 96 heads x 128x128 bf16 + q/k/v conv
                                 # (3 x 12,288 x 4 bf16), the GLM53F convention
w_resident = 1_566_590_881_794   # metadata.total_size 1,561,217,377,280 (shard-header-verified)
                                 # + the BF16 DSpark drafter 5,373,504,514 (its own checkpoint)
w_decode_shared = 111_517_783_040 # exact ledger, all BF16: KDA 61.26 + shared exp 24.31
                                 # + MLA 11.15 + latent MoE projections 9.45 + lm_head 2.35
                                 # + dense MLP 1.45 + routers 1.18 + indexers 0.36 + norms
w_route_pertok = 25_829_572_608  # 16 experts x 17,547,264 B (MXFP4 + UE8M0 group-32) x 92
w_route_total = 1_446_456_066_048 # 896 experts (kink at n = 896/16 = 56)
layers = 93
rec_layers = 69
draft_layers = 5
# draft pass: the 5-layer dense DSpark drafter 5,373,504,514 B BF16 (MEASURED,
# incl. its Markov head) + the target's lm_head 2,348,810,240 B BF16, which it
# shares (research/model_kimi_k31pro.md #5)
w_draft = 7.722e9
w_draft_route_pertok = 0.0
# one draft pass per step: a block drafter, "7 tokens per forward pass"
# (Inferact/Kimi-K3.1-Pro-DSpark-preview README)
draft_passes = 1
# acceptance MEASURED (outside): InferenceX's golden accepted length for this
# drafter on B300, SPEED-Bench coding, thinking on, probabilistic drafting with
# block verification: 3.08 at 5 drafts -> geometric a = 0.721
acceptance = 0.721
acceptance_measured = true
spec_tokens = 5                  # num_speculative_tokens: the vLLM recipe's DSpark config
draft_method = "dspark"
kv_decode_bpt = 6_048            # per CONTEXT token per step: 24 indexer scans x 132 B
                                 # + the drafter's dense read, 5 x 576 B (one pass)
kv_decode_const = 28_311_552     # B300: 24 layers x top-2048 x 576 B per active seq
kv_decode_topk = 2_048           # index_topk, read in token space
# H200: vLLM's K3.1 verifier picks fp8_ds_mla off SM10x, 656 B per latent
# (the drafter's rows too). No Hopper recipe exists and no 8xH200 node
# holds the weights; the row keeps Python's multi-node arithmetic honest.
kv_hopper_fp8 = [
    22_192,  # 24 x 656 + 24 x 132 + 5 x 656
    32_243_712,  # 24 x 2048 x 656
]
max_ctx = 1_048_576              # native 1M; the recipe runs --max-model-len 1048576
# prefill: active GEMM params excl embed/lm_head (103.19e9 ledger; card
# "104B activated"). Quadratic term priced as DENSE attention on the 24 DSA
# layers, as GLM-5.3: an upper bound. 96 heads, QK^T at 192 (nope 128 +
# rope 64) and AV at 128: attn_d is their mean width x heads.
params_prefill = 103.19e9
attn_layers = 24
attn_d = 15360                   # = 96 * (192 + 128) / 2
kv_heads = 1                     # MLA: one latent per token; the KDA state shards (96 heads)

[models.K31P.quality]  # AA's default variant (unlabelled), read 2026-11-05; no 2.1 run
tb40 = [133, 198]
aa = "kimi-k3-1-pro"

[models.K31P.explorer]
short = "Kimi-K3.1-Pro"
weights = "MXFP4"
tip = "Kimi-K3.1-Pro — 2.8T-A104B MoE: 69 KDA linear-attention layers and 24 gated DSA layers (MLA latents plus a top-2048 indexer), the routed experts in a 3,584-wide latent space (896 experts / 16 routed, kink n = 56). 19.4 KiB/token stored on B300 (24 latents of 576 B, 24 indexer keys, and the DSpark drafter's 5 dense latents) plus a 226 MiB bf16 KDA state per session, the study's heaviest. The checkpoint ships MXFP4 experts and BF16 everything else, so every step reads 111.5 GB of always-active weights (61 GB of it KDA projections) on top of 25.8 GB of experts per token. 1,566.6 GB resident with the drafter: no 8×H200 node holds it; 8×B300 at TP8, the vLLM recipe's single-node layout. No NVFP4 checkpoint. Terminal-Bench 67.2% on 4.0 (AA); AA has no 2.1 run. 1M native context. License: Kimi K3.1 Pro (MIT terms plus a separate agreement for Model-as-a-Service operators above $20M a year)."
kv_tip = "Kimi-K3.1-Pro's FP8 cache row depends on the GPU, as GLM-5.3's: on B300 vLLM serves its DSA layers through FlashInfer as plain fp8_e4m3, 576 B per latent; off Blackwell it picks fp8_ds_mla, 656 B. The indexer keys stay fp8 (132 B) in every arm. FP16 is BF16 KV, which vLLM accepts when asked for (auto becomes fp8 on Blackwell) but the recipe does not document: double the latent rows and doubled top-k reads."
speculative_config = '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":5,"method":"dspark","draft_sample_method":"probabilistic"}'
spec_with_dcp = true                # the recipe's AgentX preset runs DCP8 with this draft
# vLLM turns auto into fp8_e4m3 on Blackwell, so the BF16 arm must say bfloat16
kv_cache_dtype = { fp8_hopper = "fp8_ds_mla", fp16 = "bfloat16" }

[[models.K31P.explorer.recipe]]
at = 1
flags = ["--trust-remote-code"]

[[models.K31P.explorer.recipe]]
note = "Kimi-K3.1-Pro ships in the vllm/vllm-openai:kimi-k31 image only (no vLLM wheel includes it yet, vllm#65685, 2026-11-05); the recipe adds --load-format fastsafetensors on Blackwell to load the 1.56 TB faster"
