layers = 40
rec_layers = 0
draft_layers = 3
# draft pass: 3 DSpark stages always-active 7.13e8 (7,932,874,632 B less
# 3 x 128 x 18,800,640 of experts) + lm_head 1.324e9 BF16; routed
